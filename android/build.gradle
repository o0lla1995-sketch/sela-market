buildscript {
    ext {
        // متطلب جوجل بلاي (منذ 31/8/2026): target/compile SDK 36
        // (Android 16). compileSdk 36 مع AGP 8.7.2 (الإصدار الذي يثبّته
        // gradle-plugin الخاص بـ RN 0.77) يحتاج علم
        // `android.suppressUnsupportedCompileSdk=36` — مضبوط في
        // gradle.properties (تركيبة مجتمعية مثبتة على تطبيق نقطة
        // البيع سيلا v45+ بنفس المكدس تماماً).
        buildToolsVersion = "36.0.0"
        // 24 يغطي الأجهزة الفلسطينية/الإسرائيلية الشائعة كلها.
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // NDK r28.2 — يربط كل مكتبة أصلية بمحاذاة صفحات 16 KB (متطلب
        // إلزامي في Google Play للتطبيقات المستهدفة API 35+).
        ndkVersion = "28.2.13676358"
        // RN 0.77's gradle-plugin pins Kotlin 2.0.21.
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
